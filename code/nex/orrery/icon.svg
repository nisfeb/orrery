<!-- the orrery logo: a sun, three orbits and the bodies on them.
     Drawn the way Talon's icon is (talon scripts/make-icons.py, 2026-10-01):
     the mark centred by its drawn bounds, its longer side 62% of the
     canvas, on a rounded square of Talon's navy (#1E1B4B; 920 px with a
     52 px margin, radius 200), in the family amber (#f9a804). The
     launcher tile rounds itself and its colour is the same navy, so
     there the margin is the tile. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect x="52" y="52" width="920" height="920" rx="200" fill="#1E1B4B"/>
  <g transform="translate(132.26 132.26) scale(11.8669)">
  <g fill="none" stroke="#f9a804" stroke-width="1.5">
    <circle cx="32" cy="32" r="10"/>
    <circle cx="32" cy="32" r="18"/>
    <circle cx="32" cy="32" r="26"/>
  </g>
  <g fill="#f9a804">
    <circle cx="32" cy="32" r="4"/>
    <circle cx="42" cy="32" r="2"/>
    <circle cx="32" cy="14" r="2.2"/>
    <circle cx="13.6" cy="45" r="2.4"/>
  </g>
  </g>
</svg>
